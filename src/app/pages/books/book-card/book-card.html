<div (click)="handleTap()" role="button" tabindex="0" (keydown.enter)="handleTap()"
    class="group relative block w-full cursor-pointer overflow-hidden rounded-2xl border border-border bg-surface-white text-left transition active:scale-[0.99] hover:border-blue dark:border-border-dark dark:bg-surface-white-dark dark:hover:border-blue-dark">

    <div class="relative aspect-[2/3] w-full overflow-hidden bg-surface-alt dark:bg-surface-alt-dark">
        @if (book().coverSrc) {
        <img [src]="book().coverSrc" [alt]="book().title" class="h-full w-full object-cover" loading="lazy" />
        } @else {
        <div
            class="flex h-full w-full items-center justify-center bg-blue-soft text-3xl font-semibold text-blue dark:bg-blue-soft-dark dark:text-blue-dark">
            {{ book().title.charAt(0) }}
        </div>
        }

        @if (book().finishedAt) {
        <span
            class="absolute left-2 top-2 flex items-center gap-1 rounded-full bg-green px-2 py-0.5 text-xs font-medium text-white shadow dark:bg-green-dark dark:text-surface-white-dark">
            <i class="pi pi-check text-[10px]"></i> Terminado
        </span>
        }
    </div>

    <div class="flex flex-col gap-1 p-3">
        <h3 class="truncate font-semibold leading-snug text-main dark:text-main-dark">
            {{ book().title }}
        </h3>

        @if (book().author) {
        <p class="truncate text-xs text-muted dark:text-muted-dark">
            {{ book().author }}
        </p>
        }

        <div class="-mx-1 -mb-1 mt-1 flex items-center justify-between">
            <div class="flex items-center gap-1.5 text-xs text-muted dark:text-muted-dark">
                <i class="pi pi-book shrink-0"></i>
                <span>EPUB</span>
            </div>

            <div class="flex items-center">
                <button (click)="onTogglePin($event)"
                    [attr.aria-label]="book().isPinned ? 'Desfijar libro' : 'Fijar libro'"
                    [title]="book().isPinned ? 'Desfijar libro' : 'Fijar libro'"
                    class="flex h-9 w-9 items-center justify-center transition active:opacity-50"
                    [class.text-blue]="book().isPinned" [class.dark:text-blue-dark]="book().isPinned"
                    [class.text-muted]="!book().isPinned" [class.dark:text-muted-dark]="!book().isPinned">
                    <i class="pi text-base" [class.pi-bookmark-fill]="book().isPinned"
                        [class.pi-bookmark]="!book().isPinned"></i>
                </button>

                <button (click)="onDelete($event)" aria-label="Borrar libro" title="Borrar libro"
                    class="flex h-9 w-9 items-center justify-center text-muted transition active:opacity-50 hover:text-danger dark:text-muted-dark dark:hover:text-danger-dark">
                    <i class="pi pi-trash text-base"></i>
                </button>
            </div>
        </div>
    </div>
    <!-- Barra de progreso -->
    <div class="h-1 w-full bg-surface-alt dark:bg-surface-alt-dark" role="progressbar"
        [attr.aria-valuenow]="progressPercent()" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de lectura">
        <div class="h-full transition-[width]" [class]="book().finishedAt
        ? 'bg-green dark:bg-green-dark'
        : 'bg-blue dark:bg-blue-dark'" [style.width.%]="progressPercent()"></div>
    </div>
</div>
