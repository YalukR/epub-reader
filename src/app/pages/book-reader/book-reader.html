<div class="flex h-[calc(100vh-3.5rem)] flex-col bg-surface-white dark:bg-surface-white-dark">
  <!-- Área de lectura -->
  <div class="relative flex-1 overflow-hidden">
    @if (isLoading()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-surface-white dark:bg-surface-white-dark">
        <i class="pi pi-spin pi-spinner text-3xl text-blue dark:text-blue-dark"></i>
        <p class="text-sm text-muted dark:text-muted-dark">Abriendo libro…</p>
      </div>
    }

    @if (errorMessage()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-6 text-center">
        <i class="pi pi-exclamation-triangle text-3xl text-danger dark:text-danger-dark"></i>
        <p class="text-sm text-muted dark:text-muted-dark">{{ errorMessage() }}</p>
        <p-button label="Volver a la biblioteca" [text]="true" (onClick)="goBack()" />
      </div>
    }

    <div #readerContainer class="h-full w-full"></div>

    @if (!isLoading() && !errorMessage()) {
      <button
        (click)="prev()"
        aria-label="Página anterior"
        class="absolute left-0 top-0 h-full w-[15%] cursor-w-resize opacity-0"
      ></button>
      <button
        (click)="next()"
        aria-label="Página siguiente"
        class="absolute right-0 top-0 h-full w-[15%] cursor-e-resize opacity-0"
      ></button>
    }
  </div>
</div>

<app-reader-toc-drawer
  [open]="isTocOpen()"
  (openChange)="isTocOpen.set($event)"
  [toc]="toc()"
  [bookmarks]="bookmarks()"
  (tocItemSelected)="goToTocItem($event)"
  (bookmarkSelected)="goToBookmark($event)"
/>

<app-reader-settings-drawer
  [open]="isSettingsOpen()"
  (openChange)="isSettingsOpen.set($event)"
  [fontSize]="fontSize()"
  (fontSizeChange)="onFontSizeChange($event)"
/>
