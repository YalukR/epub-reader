<div class="flex h-full flex-col overflow-hidden overscroll-none bg-surface-white dark:bg-surface-white-dark">
  <!-- Área de lectura -->
  <div class="relative min-h-0 flex-1 overflow-hidden">
    @if (isLoading()) {
    <div
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-surface-white dark:bg-surface-white-dark">
      <i class="pi pi-spin pi-spinner text-3xl text-blue dark:text-blue-dark"></i>
      <p class="text-sm text-muted dark:text-muted-dark">Abriendo libro…</p>
    </div>
    }

    @if (errorMessage()) {
    <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-6 text-center">
      <i class="pi pi-exclamation-triangle text-3xl text-danger dark:text-danger-dark"></i>
      <p class="text-sm text-muted dark:text-muted-dark">{{ errorMessage() }}</p>
      <p-button label="Volver a la biblioteca" [text]="true" (onClick)="goBack()" />
    </div>
    }

    <div #readerContainer class="h-full w-full touch-none overflow-hidden" [style.padding-inline.px]="margin()"></div>

    @if (!isLoading() && !errorMessage()) {
    <button (click)="prev()" aria-label="Página anterior"
      class="absolute left-0 top-0 h-full w-[15%] cursor-w-resize opacity-0"></button>
    <button (click)="next()" aria-label="Página siguiente"
      class="absolute right-0 top-0 h-full w-[15%] cursor-e-resize opacity-0"></button>
    }

    <!-- Barra de subrayado: aparece al seleccionar texto o tocar un subrayado -->
    @if (pendingSelection() || activeHighlight()) {
    <div class="absolute inset-x-0 bottom-3 z-20 flex justify-center px-4">
      <div
        class="flex items-center gap-1 rounded-full border border-border bg-surface-white/95 px-2 py-1 shadow-lg backdrop-blur-md dark:border-border-dark dark:bg-surface-white-dark/95">
        @for (c of highlightColors; track c) {
        <button type="button" (click)="onPickColor(c)" [attr.aria-label]="'Subrayar con color ' + c"
          class="flex h-10 w-10 items-center justify-center">
          <span class="h-7 w-7 rounded-full ring-offset-2 ring-offset-surface-white dark:ring-offset-surface-white-dark"
            [style.background-color]="c" [class.ring-2]="activeHighlight()?.color === c"
            [class.ring-main]="activeHighlight()?.color === c"
            [class.dark:ring-main-dark]="activeHighlight()?.color === c"></span>
        </button>
        }

        @if (activeHighlight()) {
        <button type="button" (click)="deleteActiveHighlight()" aria-label="Borrar subrayado"
          class="flex h-10 w-10 items-center justify-center text-muted active:opacity-50 hover:text-danger dark:text-muted-dark dark:hover:text-danger-dark">
          <i class="pi pi-trash"></i>
        </button>
        }

        <button type="button" (click)="closeHighlightBar()" aria-label="Cerrar"
          class="flex h-10 w-10 items-center justify-center text-muted active:opacity-50 dark:text-muted-dark">
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>
    }
  </div>
</div>

<app-reader-toc-drawer [open]="isTocOpen()" (openChange)="isTocOpen.set($event)" [toc]="toc()" [bookmarks]="bookmarks()"
  (tocItemSelected)="goToTocItem($event)" (bookmarkSelected)="goToBookmark($event)" />

<app-reader-settings-drawer [open]="isSettingsOpen()" (openChange)="isSettingsOpen.set($event)" [fontSize]="fontSize()"
  (fontSizeChange)="onFontSizeChange($event)" [fontId]="fontId()" (fontIdChange)="onFontIdChange($event)"
  [lineHeight]="lineHeight()" (lineHeightChange)="onLineHeightChange($event)" [margin]="margin()"
  (marginChange)="onMarginChange($event)" [finished]="finished()" (finishedChange)="onFinishedChange($event)" />
